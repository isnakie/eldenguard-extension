<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WiseOwl</title>
  <link rel="stylesheet" href="sidebar.css" />
</head>
<body>
  <div class="sidebar">

    <!-- Header -->
    <header class="sidebar__header">
      <div class="sidebar__brand">
        <div class="sidebar__avatar-mini" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 36 36" >
            <circle cx="18" cy="15" r="12" fill="#0D3B6E"/>
            <circle cx="13" cy="14" r="4.5" fill="#CADCFC"/>
            <circle cx="13" cy="14" r="3" fill="#00A896"/>
            <circle cx="13" cy="14" r="1.5" fill="#062A52"/>
            <circle cx="14" cy="13" r="0.8" fill="white"/>
            <circle cx="23" cy="14" r="4.5" fill="#CADCFC"/>
            <circle cx="23" cy="14" r="3" fill="#00A896"/>
            <circle cx="23" cy="14" r="1.5" fill="#062A52"/>
            <circle cx="24" cy="13" r="0.8" fill="white"/>
            <path d="M15 19 L18 22 L21 19 Q18 17 15 19Z" fill="#F5A623"/>
            <path d="M18 26 L22 27.5 L22 32.5 Q22 35 18 36 Q14 35 14 32.5 L14 27.5 Z" fill="#00A896"/>
            <path d="M16 31 L17.5 33 L20.5 29" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>
        <div>
          <h1 class="sidebar__title">WiseOwl</h1>
          <p class="sidebar__subtitle" id="current-url" title="">Loading...</p>
        </div>
      </div>
      <div class="sidebar__status" id="safety-status" aria-live="polite"></div>
    </header>

    <!-- Quick action buttons -->
    <div class="quick-actions" role="group" aria-label="Quick actions">
      <button class="quick-btn" id="btn-check-page" title="Check if this page is safe">
        <span class="quick-btn__icon">🛡</span>
        <span>Check page</span>
      </button>
      <button class="quick-btn" id="btn-screenshot" title="Analyze something on screen">
        <span class="quick-btn__icon">📸</span>
        <span>Screen grab</span>
      </button>
      <button class="quick-btn" id="btn-explain" title="Explain what this page is about">
        <span class="quick-btn__icon">💬</span>
        <span>Explain page</span>
      </button>
      <button class="quick-btn" id="btn-scam-alerts" title="Recent scam alerts from FTC">
        <span class="quick-btn__icon">🚨</span>
        <span>Scam Alerts</span>
      </button>
    </div>

    <!-- FTC Scam Alerts Panel -->
    <section class="alerts-panel" id="alerts-panel" hidden aria-label="Recent FTC Scam Alerts">
      <div class="alerts-panel__header">
        <span>Recent FTC Scam Alerts</span>
        <button class="alerts-panel__close" id="btn-close-alerts" aria-label="Close alerts panel">✕</button>
      </div>
      <div class="alerts-panel__list" id="alerts-list">
        <p class="alerts-panel__loading">Loading alerts...</p>
      </div>
      <p class="alerts-panel__source">Source: <a href="https://consumer.ftc.gov" target="_blank" rel="noopener">consumer.ftc.gov</a></p>
    </section>

    <!-- Chat messages -->
    <main class="chat" id="chat-messages" aria-label="Chat with WiseOwl" aria-live="polite">
      <div class="chat__welcome">
        <p>Hi! I'm WiseOwl 👋</p>
        <p>I'm here to help you stay safe online. Ask me anything about this page, or click a button above to get started.</p>
      </div>
    </main>

    <!-- Input area -->
    <footer class="input-area">
      <label for="chat-input" class="sr-only">Ask WiseOwl a question</label>
      <div class="input-area__row">
        <textarea
          id="chat-input"
          class="input-area__textarea"
          placeholder="Ask me anything about this page..."
          rows="2"
          aria-label="Your question"
          maxlength="500"
        ></textarea>
        <button class="input-area__send" id="btn-send" aria-label="Send message">
          <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M22 2L11 13M22 2L15 22L11 13L2 9L22 2Z" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <p class="input-area__hint">Press Enter to send · Shift+Enter for new line</p>
    </footer>
  </div>

  <script type="module" src="sidebar.js"></script>
</body>
</html>
